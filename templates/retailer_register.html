{% extends 'base.html' %}
{% block title %}Retailer Register - Easykirai{% endblock %}
{% block auth_content %}
<div class="auth-card">
    <h2>Retailer Registration</h2>
    <form method="POST" id="retailerRegForm">
        <div class="form-group">
            <label>Contact Name</label>
            <input type="text" name="contact_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Shop Name</label>
            <input type="text" name="shop_name" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Business Address</label>
            <textarea name="business_address" class="form-control" required></textarea>
        </div>
        <div class="form-group">
            <label>GSTIN (15 chars)</label>
            <input type="text" name="gstin" class="form-control" required pattern=".{15}" title="15 characters">
        </div>
        <div class="form-group">
            <label>Phone Number (10 digits)</label>
            <input type="text" name="phone" class="form-control" required pattern="\d{10}">
        </div>
        <div class="form-group">
            <label>City</label>
            <input type="text" name="city" class="form-control" value="Dehradun" required>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" id="r_password" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="r_confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn mt-4">Register</button>
    </form>
    <p class="text-center mt-4">Already have an account? <a href="{{ url_for('retailer_login') }}">Login</a></p>
    <p class="text-center mt-4"><a href="{{ url_for('landing') }}">← Back to Home</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('retailerRegForm').addEventListener('submit', function(e) {
    var p1 = document.getElementById('r_password').value;
    var p2 = document.getElementById('r_confirm_password').value;
    if (p1 !== p2) {
        e.preventDefault();
        alert('Passwords do not match!');
    }
});
</script>
{% endblock %}
